# Dev and test: Quarkus Dev Services starts PostgreSQL 18.6 with pgvector 0.8.7 in a local container.
# Production: set QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11

quarkus.flyway.migrate-at-start=true

# Model files from ./gradlew :rag-app:downloadEmbeddingModel (relative to the module directory)
rag.model-dir=build/embedding-model
# Chunking: sections along the headings, at most 250 words, 40 words overlap
rag.chunk.max-words=250
rag.chunk.overlap-words=40
# Index the corpus at start if it is missing or a document has a new version
rag.ingest-on-start=true
%test.rag.ingest-on-start=false
